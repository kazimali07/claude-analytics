[project]
name = "claude-usage"
version = "0.1.0"
description = "Local dashboard tracking Claude Code usage against Max 5x limits, exposed over MCP."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "watchdog>=4.0",
    "textual>=0.74",
    "mcp>=1.2",
]

[project.scripts]
claude-usage = "claude_usage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
